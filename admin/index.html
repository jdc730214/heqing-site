<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>禾青醫電 後台管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <script type="module" crossorigin src="/admin/assets/index-38INpLr9.js"></script>
  <link rel="stylesheet" crossorigin href="/admin/assets/index-B1XzWchU.css">
</head>
<body>

  <!-- 登入中 / 驗證中畫面 -->
  <div id="loading-screen" class="vh-100 d-flex align-items-center justify-content-center">
    <div class="text-center text-muted">
      <div class="spinner-border mb-3" role="status"></div>
      <div>驗證中...</div>
    </div>
  </div>

  <!-- 主要 App 框架（登入後顯示）-->
  <div id="app" class="d-none">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
      <span class="navbar-brand fw-bold">禾青醫電 後台</span>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="text-light small" id="nav-user-info"></span>
        <button class="btn btn-outline-light btn-sm" id="btn-logout">
          <i class="bi bi-box-arrow-right"></i> 登出
        </button>
      </div>
    </nav>

    <!-- 主體：sidebar + 內容 -->
    <div class="d-flex" style="min-height: calc(100vh - 56px);">

      <!-- Sidebar -->
      <nav class="sidebar bg-light border-end p-3" style="width: 220px; flex-shrink: 0;">
        <ul class="nav flex-column gap-1">
          <li class="nav-item">
            <a href="#/groups" class="nav-link text-dark sidebar-link" data-route="groups">
              <i class="bi bi-people-fill me-2"></i>群組管理
            </a>
          </li>
          <li class="nav-item admin-only d-none">
            <a href="#/accounts" class="nav-link text-dark sidebar-link" data-route="accounts">
              <i class="bi bi-person-gear me-2"></i>帳號管理
            </a>
          </li>
          <li class="nav-item admin-only d-none">
            <a href="#/subscriptions" class="nav-link text-dark sidebar-link" data-route="subscriptions">
              <i class="bi bi-credit-card me-2"></i>訂閱管理
            </a>
          </li>
        </ul>
      </nav>

      <!-- 主內容區 -->
      <main class="flex-grow-1 p-4" id="main-content">
        <!-- 由 JS router 動態填入 -->
      </main>

    </div>
  </div>

  <!-- Modal 容器（共用）-->
  <div class="modal fade" id="app-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <!-- Toast 通知 -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
    <div id="app-toast" class="toast align-items-center border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toast-body"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
