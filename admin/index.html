<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>禾青醫電 後台管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <script type="module" crossorigin src="/admin/assets/index-BW1uA5D7.js"></script>
  <link rel="stylesheet" crossorigin href="/admin/assets/index-BwpLrfWe.css">
</head>
<body>

  <!-- 驗證中 -->
  <div id="loading-screen" class="loading-screen">
    <div class="text-center">
      <div class="spinner-border text-primary mb-3" role="status"></div>
      <div class="text-muted small">驗證中...</div>
    </div>
  </div>

  <!-- 主 App -->
  <div id="app" class="d-none app-layout">

    <!-- Sidebar 遮罩（行動版） -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <i class="bi bi-heart-pulse-fill"></i>
        <span>禾青醫電後台</span>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-section-label">主選單</div>
        <a href="#/groups" class="sidebar-link" data-route="groups">
          <i class="bi bi-people-fill"></i>
          <span>群組管理</span>
        </a>
        <a href="#/accounts" class="sidebar-link admin-only d-none" data-route="accounts">
          <i class="bi bi-person-gear"></i>
          <span>帳號管理</span>
        </a>
        <a href="#/keygen" class="sidebar-link admin-only d-none" data-route="keygen">
          <i class="bi bi-key-fill"></i>
          <span>授權金鑰</span>
        </a>
        <a href="#/icope-licenses" class="sidebar-link admin-only d-none" data-route="icope-licenses">
          <i class="bi bi-shield-lock-fill"></i>
          <span>ICOPE 授權</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <i class="bi bi-person-circle"></i>
          <span id="nav-user-info" class="sidebar-user-text"></span>
        </div>
        <button class="btn btn-sm btn-outline-secondary w-100 mt-2" id="btn-logout">
          <i class="bi bi-box-arrow-right me-1"></i>登出
        </button>
      </div>
    </aside>

    <!-- 主區域 -->
    <div class="main-wrapper">

      <!-- Topbar（主要供手機版用） -->
      <header class="topbar">
        <button id="btn-sidebar-toggle" class="topbar-toggle" aria-label="選單">
          <i class="bi bi-list"></i>
        </button>
        <span class="topbar-brand">
          <i class="bi bi-heart-pulse-fill"></i>
          禾青醫電後台
        </span>
      </header>

      <!-- 頁面內容 -->
      <main id="main-content" class="main-content">
        <!-- 由 JS router 動態填入 -->
      </main>

    </div>
  </div>

  <!-- Modal 容器（共用） -->
  <div class="modal fade" id="app-modal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <!-- Toast 通知 -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
    <div id="app-toast" class="toast align-items-center border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body fw-semibold" id="toast-body"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
